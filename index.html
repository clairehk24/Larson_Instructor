<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clinical Simulations for the Athletic Trainer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#viewerRegion">Skip to course content</a>

    <div class="app" id="app">
      <div class="mobile-scrim" id="mobileScrim" hidden></div>

      <aside class="sidebar" id="sidebar" aria-label="Course navigation">
        <div class="sidebar-cover" aria-hidden="true"></div>

        <div class="brand-panel">
          <img src="assets/HK logo horizontal 4C.png" alt="Human Kinetics" class="brand-logo" />
          <p class="eyebrow">Instructor Guide</p>
          <h1>Clinical Simulations for the Athletic Trainer</h1>
        </div>

        <div class="sidebar-tools">
          <div class="search-wrap">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" /></svg>
            <input id="courseSearch" type="search" autocomplete="off" placeholder="Search simulations" aria-label="Search simulations" aria-describedby="searchStatus" />
            <p class="sr-only" id="searchStatus" role="status" aria-live="polite"></p>
          </div>
        </div>

        <nav class="course-nav" id="courseNav" aria-label="Lessons and simulations"></nav>

        <div class="sidebar-progress" aria-label="Course progress">
          <div class="progress-copy">
            <span>Progress</span>
            <strong id="progressText">0 of 37 complete</strong>
          </div>
          <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
        </div>
      </aside>

      <main class="main-shell">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-button menu-button" id="menuButton" type="button" aria-controls="sidebar" aria-expanded="false">
              <span class="sr-only">Open course menu</span>
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
            </button>
            <div class="title-group">
              <h2 id="pageTitle" aria-live="polite" aria-atomic="true">Introduction</h2>
            </div>
          </div>

          <div class="topbar-actions">
            <button class="secondary-button" id="openPageButton" type="button" aria-label="Open current page in a new window">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M19 13v6H5V5h6" /></svg>
              Open page
            </button>
            <button class="complete-button" id="completeButton" type="button" aria-pressed="false" aria-label="Mark current page complete">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></svg>
              <span>Mark complete</span>
            </button>
          </div>
        </header>

        <section class="viewer-region" id="viewerRegion" aria-label="Selected course page" tabindex="-1">
          <iframe id="contentFrame" name="contentFrame" title="Introduction" src="pages/introduction.html"></iframe>
        </section>

        <footer class="page-controls" aria-label="Page navigation">
          <button class="previous-button" id="previousButton" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
            <span>
              <small>Previous</small>
              <strong id="previousLabel">Previous page</strong>
            </span>
          </button>
          <button class="next-button" id="nextButton" type="button">
            <span>
              <small>Next</small>
              <strong id="nextLabel">Next page</strong>
            </span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
          </button>
        </footer>
      </main>
    </div>

    <script src="data/navigation.js"></script>
    <script src="app.js"></script>
  </body>
</html>
